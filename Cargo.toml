[package]
name = "ct-ed25519"
version = "0.0.2"
edition = "2024"
description = "Constant-time Ed25519 signatures (RFC 8032)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/power-system/ct-ed25519"
readme = "README.md"
keywords = ["ed25519", "signature", "constant-time", "cryptography"]
categories = ["cryptography"]

[dependencies]
ct-curve-point = { version = "0.0.2", default-features = false }
ct-fp = { version = "0.0.2", default-features = false }
ct-scalar = { version = "0.0.2", default-features = false }
ct-uint = { version = "0.0.3", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
signature = { version = "3.0.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.1", default-features = false, features = ["derive"], optional = true }

[features]
default = ["zeroize"]
zeroize = ["dep:zeroize", "ct-uint/zeroize"]

[dev-dependencies]
hex = "0.4.3"

[patch.crates-io]
ct-uint = { path = "../ct-uint" }
ct-fp = { path = "../ct-fp" }
ct-scalar = { path = "../ct-scalar" }
ct-curve-point = { path = "../ct-curve-point" }
